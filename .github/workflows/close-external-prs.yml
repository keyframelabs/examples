name: Close external PRs
on:
  pull_request_target:
    types: [opened]
permissions:
  pull-requests: write
jobs:
  close:
    if: github.repository == 'keyframelabs/examples'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "Thanks for the interest! This repository is a read-only mirror and isn't accepting pull requests right now (see CONTRIBUTING.md). Please open an issue instead."
          gh pr close "$PR" --repo "$GITHUB_REPOSITORY"
