[project]
name = "kfl-system-design-interview-demo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.116.1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.6,<3",
    "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.8,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["server"]
testpaths = ["server/tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["server"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
